    <style>

        .bg-red-50 { background: #fef2f2; }

        .bg-yellow-50 { background: #fffbeb; }

        .p-1 { padding: 0.25rem; }
        .p-2 { padding: 0.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }

        .p-6 { padding: 1.5rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }

        .mt-1 { margin-top: 0.25rem; }

        .w-full { width: 100%; }

        .shadow-pink { box-shadow: 0 8px 32px rgba(236,72,153,0.12); }
        
        .grid { display: grid; }
        .grid-cols-1 { grid-template-columns: repeat(1, 1fr); }
        .grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-cols-3 { grid-template-columns: repeat(3, 1fr); }

        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        
        .hidden { display: none; }
        .block { display: block; }
        .inline-block { display: inline-block; }
        .inline-flex { display: inline-flex; }
        
        /* ===== CARD ===== */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow);
            border: 1px solid rgba(236,72,153,0.12);
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        .card:hover { box-shadow: 0 12px 40px rgba(236,72,153,0.12); transform: translateY(-2px); }
        .card-header { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; color: #be185d; }
        .card-header-left { display: flex; align-items: center; gap: 0.5rem; }
        
        /* ===== INPUT ===== */
        .input-field {
            width: 100%;
            padding: 0.6rem 0.875rem;
            border: 2px solid #fce7f3;
            border-radius: 12px;
            font-size: 0.875rem;
            background: rgba(255,255,255,0.9);
            transition: all 0.3s ease;
            color: #4a3f47;
        }
        .input-field:focus { outline: none; border-color: #ec4899; box-shadow: 0 0 0 4px rgba(236,72,153,0.1); }
        .input-field:disabled { background: #f3f4f6; cursor: not-allowed; color: #9ca3af; }
        .input-field-sm { padding: 0.4rem 0.75rem; font-size: 0.8rem; }
        .input-field-xs { padding: 0.2rem 0.5rem; font-size: 0.7rem; }
        
        /* ===== BUTTON ===== */
        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            white-space: nowrap;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .btn-primary { background: linear-gradient(135deg, #ec4899, #be185d); color: white; box-shadow: 0 4px 15px rgba(236,72,153,0.3); }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 25px rgba(236,72,153,0.4); }
        .btn-secondary { background: #fdf2f8; color: #be185d; border: 2px solid #fbcfe8; }
        .btn-secondary:hover:not(:disabled) { background: #fce7f3; transform: translateY(-2px); }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover:not(:disabled) { background: #dc2626; transform: translateY(-2px); }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; box-shadow: 0 4px 15px rgba(245,158,11,0.3); }
        .btn-warning:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 25px rgba(245,158,11,0.4); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 4px 15px rgba(16,185,129,0.3); }
        .btn-success:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 25px rgba(16,185,129,0.4); }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.75rem; }
        .btn-xs { padding: 0.2rem 0.5rem; font-size: 0.65rem; }
        .btn-block { width: 100%; justify-content: center; }
        
        /* ===== NAV TABS ===== */
        .nav-tabs {
            display: flex;
            gap: 0.35rem;
            padding: 0.4rem;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 60px;
            border: 1px solid rgba(236,72,153,0.12);
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            overflow-x: auto;
        }
        .nav-tab {
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-weight: 600;
            color: #a78b9a;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .nav-tab:hover { background: #fdf2f8; color: #be185d; }
        .nav-tab.active { background: linear-gradient(135deg, #ec4899, #be185d); color: white; box-shadow: 0 4px 15px rgba(236,72,153,0.3); }
        
        /* ===== KODE BADGE ===== */
        .kode-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .kode-1 { background: #fef3c7; color: #92400e; }
        .kode-2 { background: #d1fae5; color: #065f46; }
        .kode-3 { background: #fee2e2; color: #991b1b; }
        .kode-5 { background: #f3e8ff; color: #6b21a8; }
        .kode-6 { background: #ffe4e6; color: #9f1239; }
        .kode-7 { background: #cffafe; color: #155e75; }
        .kode-8 { background: #fed7aa; color: #7b341e; }
        .kode-9 { background: #f1f5f9; color: #334155; }
        
        /* ===== SCORECARD ===== */
        .scorecard {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1rem;
            border: 2px solid rgba(236,72,153,0.1);
            text-align: center;
            transition: all 0.3s ease;
        }
        .scorecard:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(236,72,153,0.12); }
        .scorecard-value { font-size: 1.8rem; font-weight: 800; margin: 0.3rem 0; background: linear-gradient(135deg, #ec4899, #be185d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .scorecard.good .scorecard-value { background: linear-gradient(135deg, #10b981, #059669); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .scorecard.bad .scorecard-value { background: linear-gradient(135deg, #ef4444, #dc2626); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .scorecard-label { font-size: 0.7rem; color: #8b7a87; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .scorecard .sub-text { font-size: 0.6rem; color: #a78b9a; }
        
        /* ===== TIMELINE CARD ===== */
        .timeline-card {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 0.75rem;
            border: 1px solid #fce7f3;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
            transition: all 0.3s ease;
        }
        .timeline-card:hover { transform: translateX(4px); box-shadow: 0 4px 20px rgba(236,72,153,0.08); }
        .timeline-card .flex-1 { flex: 1; min-width: 120px; }
        .timeline-card .packer-tags { display: flex; flex-wrap: wrap; gap: 4px; }
        .timeline-card .packer-tag { background: #fce7f3; color: #be185d; padding: 2px 10px; border-radius: 30px; font-size: 9px; font-weight: 600; }
        .timeline-card .packer-count { background: #dbeafe; color: #1d4ed8; padding: 2px 10px; border-radius: 30px; font-size: 9px; font-weight: 700; }
        .timeline-card .wr-field { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
        .timeline-card .wr-field input { width: 100px; padding: 3px 6px; border: 1px solid #fce7f3; border-radius: 6px; font-size: 0.7rem; }
        .timeline-card .wr-field input:focus { outline: none; border-color: #ec4899; }
        .timeline-card .wr-field .wr-label { font-size: 0.65rem; color: #8b7a87; font-weight: 600; }
        .timeline-card .btn-remove { color: #ef4444; background: none; border: none; cursor: pointer; padding: 0.25rem; font-size: 0.875rem; }
        
        /* ===== PACKER CHECKBOX ===== */
        .packer-checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 6px;
            margin-top: 8px;
        }
        .packer-checkbox-grid label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: #fdf2f8;
            border-radius: 8px;
            border: 1px solid #fce7f3;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.8rem;
        }
        .packer-checkbox-grid label:hover { background: #fce7f3; }
        .packer-checkbox-grid label:has(input:checked) { background: #fbcfe8; border-color: #ec4899; }
        .packer-checkbox-grid input[type="checkbox"] { width: 14px; height: 14px; accent-color: #ec4899; cursor: pointer; flex-shrink: 0; }
        
        /* ===== OUTPUT PER PACKER ===== */
        .packer-output-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
            margin-top: 8px;
        }
        .packer-output-item {
            background: #fdf2f8;
            border-radius: 10px;
            padding: 6px 12px;
            border: 1px solid #fce7f3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .packer-output-item .label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #be185d;
            min-width: 70px;
        }
        .packer-output-item input {
            width: 80px;
            padding: 4px 6px;
            border: 1px solid #fce7f3;
            border-radius: 6px;
            font-size: 0.75rem;
            text-align: right;
        }
        .packer-output-item input:focus {
            outline: none;
            border-color: #ec4899;
        }
        
        /* ===== BATCH TAG ===== */
        .batch-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #fdf2f8;
            border-radius: 30px;
            padding: 2px 10px 2px 14px;
            border: 1px solid #fce7f3;
        }
        .batch-tag input {
            background: transparent;
            border: none;
            font-size: 0.75rem;
            width: 80px;
            padding: 2px 0;
            color: #4a3f47;
            outline: none;
        }
        .batch-tag input:focus {
            border-bottom: 1px solid #ec4899;
        }
        .batch-tag .remove-batch {
            color: #ef4444;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0 2px;
        }
        .batch-tag .remove-batch:hover { color: #dc2626; }
        
        /* ===== RESUME CARD ===== */
        .resume-card {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 0.75rem;
            border: 1px solid #fce7f3;
            text-align: center;
        }
        .resume-value { font-size: 1.3rem; font-weight: 700; color: #be185d; }
        .resume-label { font-size: 0.6rem; color: #8b7a87; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
        
        /* ===== SISA JAM CARD ===== */
        .sisa-jam-card {
            background: linear-gradient(135deg, #fdf2f8, #fce7f3);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 2px solid #fbcfe8;
        }
        
        /* ===== TABLE ===== */
        .table-wrapper { overflow-x: auto; border-radius: 12px; border: 1px solid #fce7f3; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; font-size: 0.8rem; }
        th { background: linear-gradient(135deg, #ec4899, #be185d); color: white; padding: 0.6rem 0.8rem; font-weight: 600; font-size: 0.7rem; text-align: left; white-space: nowrap; }
        td { padding: 0.6rem 0.8rem; border-bottom: 1px solid #fce7f3; font-size: 0.75rem; vertical-align: middle; }
        tr.clickable-row { cursor: pointer; transition: background 0.2s; }
        tr.clickable-row:hover { background: rgba(236,72,153,0.06); }
        tr.row-selected { background: rgba(236,72,153,0.12) !important; }
        .status-good { color: #10b981; font-weight: 600; }
        .status-bad { color: #ef4444; font-weight: 600; }
        .notes-wrap { max-width: 120px; word-wrap: break-word; word-break: break-word; white-space: normal; line-height: 1.3; font-size: 0.7rem; }
        
        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            right: 12px;
            padding: 0.75rem 1rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(236,72,153,0.15);
            border-left: 4px solid #ec4899;
            font-weight: 600;
            z-index: 9999;
            animation: slideIn 0.3s ease;
            max-width: 90%;
            font-size: 0.85rem;
            transition: opacity 0.3s ease;
        }
        .toast.error { border-left-color: #ef4444; }
        .toast.warning { border-left-color: #f59e0b; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            padding: 0.75rem;
        }
        .modal-content {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 1.25rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(236,72,153,0.1);
        }
        
        /* ===== FILTER SECTION ===== */
        .filter-section { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
        
        /* ===== CHART ===== */
        .chart-container { height: 200px; position: relative; width: 100%; }
        .chart-container-horizontal { height: 250px; position: relative; }
        
        /* ===== GRADIENT ===== */
        .gradient-bg {
            background: linear-gradient(135deg, #ec4899, #be185d, #db2777, #f472b6);
            background-size: 300% 300%;
            animation: gradient 8s ease infinite;

<script>
(function() {
    'use strict';
    
    // ==================== KONFIGURASI ====================
    const CONFIG = {
        OEE_TARGET: 88,
        OEE365_TARGET: 55,
        A_TARGET: 85,
        A365_TARGET: 60,
        P_TARGET: 98,
        Q_TARGET: 99,
        MANAGEMENT_PASSWORD: 'admin123',
        SPV_PASSWORD: 'spv123',
        API_URL: 'api.php',
        WR_THRESHOLD_MINUTES: 180
    };
    
    const KODE_TKL = {
        '1': { name: 'PERSIAPAN AWAL (SETUP)', icon: '🔧', hasDuration: true, allowOthers: false },
        '2': { name: 'JALAN PROSES (RUNNING)', icon: '⚙️', hasDuration: false, allowOthers: false },
        '3': { name: 'LINESTOP MESIN', icon: '⚠️', hasDuration: false, allowOthers: true },
        '5': { name: 'AM ACTIVITY', icon: '🧹', hasDuration: true, allowOthers: false },
        '6': { name: 'PM, CLOSE TAG', icon: '🔩', hasDuration: false, allowOthers: false },
        '7': { name: 'CLEANING AKHIR', icon: '🧼', hasDuration: true, allowOthers: false },
        '8': { name: 'ISTIRAHAT, BRIEFING', icon: '☕', hasDuration: true, allowOthers: true },
        '9': { name: 'LINE STOP NON MESIN', icon: '⏸️', hasDuration: true, allowOthers: true }
    };
    
    const SHIFTS = {
        'SHIFT 1 (07:00-15:30)': { start: '07:00', end: '15:30', minutes: 510 },
        'SHIFT 2 (15:20-22:50)': { start: '15:20', end: '22:50', minutes: 450 },
        'SHIFT 3 (22:40-07:10)': { start: '22:40', end: '07:10', minutes: 530 },
        'LONGSHIFT PAGI (07:00-19:00)': { start: '07:00', end: '19:00', minutes: 720 },
        'LONGSHIFT MALAM (19:00-07:00)': { start: '19:00', end: '07:00', minutes: 720 }
    };
    
    // ==================== STATE ====================
    let currentPage = 'dashboard';
    let allLines = [];
    let allOEERecords = [];
    let libraryKegiatan = {};
    let allPackers = [];
    let chartInstances = {};
    let isManagementUnlocked = false;
    let isLoading = false;
    
    let kegiatanList = [];
    let batches = [];
    let selectedDate = new Date().toISOString().split('T')[0];
    let selectedShift = '';
    let selectedLineId = '';
    let inputNotes = '';
    let editMode = false;
    let editingRecordId = null;
    let minorStopData = [];
    
    let outputPerPacker = {};
    let globalReject = 0;
    
    let spvApproved = false;
    let spvInisial = '';
    
    let filters = {
        startDate: getCurrentMonthStart(),
        endDate: getCurrentMonthEnd(),
        shift: 'all',
        line: 'all',
        pic: 'all'
    };
    
    // ==================== HELPER FUNCTIONS ====================
    function getCurrentMonthStart() {
        const d = new Date(); d.setDate(1); return d.toISOString().split('T')[0];
    }
    function getCurrentMonthEnd() {
        const d = new Date(); d.setMonth(d.getMonth() + 1); d.setDate(0); return d.toISOString().split('T')[0];
    }
    function formatDate(dateStr) {
        if (!dateStr) return '-';
        try { return new Date(dateStr).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }); } catch { return dateStr; }
    }
    function formatDateShort(dateStr) {
        if (!dateStr) return '-';
        try { return new Date(dateStr).toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit' }); } catch { return dateStr; }
    }
    function formatDateTime(dateStr) {
        if (!dateStr) return '-';
        try {
            const d = new Date(dateStr);
            const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
            return `${d.getDate().toString().padStart(2,'0')}-${months[d.getMonth()]}-${d.getFullYear()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
        } catch { return dateStr; }
    }
    function toUpper(str) { return str ? str.toString().toUpperCase() : ''; }
    
    // ==================== TOAST ====================
    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        const icons = { success: '✅', error: '❌', warning: '⚠️' };
        toast.innerHTML = `${icons[type] || '✅'} ${message}`;
        const existingToasts = document.querySelectorAll('.toast');
        let topOffset = 20;
        existingToasts.forEach(t => { topOffset += t.offsetHeight + 10; });
        toast.style.top = topOffset + 'px';
        toast.style.right = '12px';
        toast.style.position = 'fixed';
        toast.style.zIndex = '9999';
        toast.style.opacity = '1';
        toast.style.transition = 'opacity 0.3s ease';
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 300);
        }, 4000);
    }
    
    function showModal(content) {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-content">${content}</div>`;
        modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
        document.body.appendChild(modal);
    }
    function closeModal() { document.querySelector('.modal-overlay')?.remove(); }
    
    // ==================== CROSS MIDNIGHT ====================
    function isTimeGreater(t1, t2) {
        if (!t1 || !t2) return false;
        const [h1, m1] = t1.split(':').map(Number);
        const [h2, m2] = t2.split(':').map(Number);
        if (h1 >= 18 && h2 < 12) return false;
        if (h2 >= 18 && h1 < 12) return true;
        return h1 > h2 || (h1 === h2 && m1 > m2);
    }
    
    function hitungDurasi(dari, sampai) {
        if (!dari || !sampai) return 0;
        const [h1, m1] = dari.split(':').map(Number);
        const [h2, m2] = sampai.split(':').map(Number);
        let jam = h2 - h1;
        let menit = m2 - m1;
        if (jam < 0 || (jam === 0 && menit < 0)) { jam += 24; }
        return jam * 60 + menit;
    }
    
    function getShiftMinutes(shiftKey) {
        const key = shiftKey || selectedShift;
        return SHIFTS[key]?.minutes || 480;
    }
    function getShiftStart() {
        return selectedShift ? SHIFTS[selectedShift]?.start || '07:00' : '07:00';
    }
    function getShiftEnd() {
        if (kegiatanList.length > 0) { return kegiatanList[kegiatanList.length - 1].jam; }
        return selectedShift ? SHIFTS[selectedShift]?.end || '15:30' : '15:30';
    }
    function getTotalDurasiKegiatan() {
        if (kegiatanList.length === 0) return 0;
        const first = kegiatanList[0];
        const last = kegiatanList[kegiatanList.length - 1];
        return hitungDurasi(first.dari, last.jam);
    }
    function getNextStart() { return kegiatanList.length === 0 ? getShiftStart() : kegiatanList[kegiatanList.length - 1].jam; }
    function getLineName(lineId) {
        const line = allLines.find(l => l.id === lineId);
        return line?.name || lineId;
    }
    function getLineTarget(lineId) {
        const line = allLines.find(l => l.id === lineId);
        return line?.target || 0;
    }
    function getPackerName(packerId) {
        const p = allPackers.find(p => p.id === packerId);
        return p?.nama || packerId;
    }
    function getPackerNames(packerIds) {
        if (!packerIds || !packerIds.length) return [];
        return packerIds.map(id => getPackerName(id)).filter(Boolean);
    }
    function hitungTotalPacker(kegiatanList) {
        const allPackersSet = new Set();
        kegiatanList.forEach(k => {
            if (k.packers && k.packers.length) {
                k.packers.forEach(p => allPackersSet.add(p));
            }
        });
        return allPackersSet.size || 1;
    }
    
    // ==================== FUNGSI UNTUK MENDAPATKAN PACKER UNIQUE DARI KODE 2 ====================
    function getUniqueRunningPackers() {
        const packerSet = new Set();
        kegiatanList.forEach(k => {
            if (k.kode === 2 && k.packers && k.packers.length) {
                k.packers.forEach(p => packerSet.add(p));
            }
        });
        return Array.from(packerSet);
    }
    
    function getLastSelectedPackers() {
        if (kegiatanList.length === 0) return [];
        const last = kegiatanList[kegiatanList.length - 1];
        return last.packers || [];
    }
    
    function getTotalOutputFromPacker() {
        let total = 0;
        // Hanya hitung output untuk packer yang ada di running activities
        const runningPackers = getUniqueRunningPackers();
        runningPackers.forEach(packerId => {
            if (outputPerPacker[packerId]) {
                total += parseInt(outputPerPacker[packerId].good) || 0;
            }
        });
        return total;
    }
    
    function getTotalReject() {
        return globalReject || 0;
    }
    
    function hitungPackerRunning(kegiatanList) {
        const runningActivities = kegiatanList.filter(k => k.kode === 2);
        if (runningActivities.length === 0) return 0;
        const lastRunning = runningActivities[runningActivities.length - 1];
        return lastRunning.packers ? lastRunning.packers.length : 0;
    }
    
    function hitungTotalTargetOutput(kegiatanList, lineId) {
        const line = allLines.find(l => l.id === lineId);
        const targetPerPacker = line?.target || 0;
        const runningActivities = kegiatanList.filter(k => k.kode === 2);
        let totalTargetOutput = 0;
        runningActivities.forEach(k => {
            const durasi = hitungDurasi(k.dari, k.jam);
            const jumlahPacker = k.packers ? k.packers.length : 0;
            totalTargetOutput += durasi * targetPerPacker * jumlahPacker;
        });
        return totalTargetOutput;
    }
    
    // ==================== API CALLS ====================
    async function apiCall(endpoint, method = 'GET', data = null) {
        isLoading = true;
        try {
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            if (data) options.body = JSON.stringify(data);
            const response = await fetch(`${CONFIG.API_URL}?action=${endpoint}`, options);
            const result = await response.json();
            if (!result.success) {
                showToast(result.message || 'Terjadi kesalahan', 'error');
                return null;
            }
            return result;
        } catch (error) {
            showToast('Gagal terhubung ke server. Pastikan api.php berjalan.', 'error');
            console.error('API Error:', error);
            return null;
        } finally {
            isLoading = false;
        }
    }
    
    // ==================== LOAD DATA ====================

        const linesResult = await apiCall('get_lines');
        if (linesResult && linesResult.data) { allLines = linesResult.data; } else { allLines = []; }
        const libraryResult = await apiCall('get_library');
        if (libraryResult && libraryResult.data) { libraryKegiatan = libraryResult.data; } else { libraryKegiatan = {}; }
        const packersResult = await apiCall('get_packers');
        if (packersResult && packersResult.data) { allPackers = packersResult.data; } else { allPackers = []; }
        const recordsResult = await apiCall('get_records');
        if (recordsResult && recordsResult.data) { allOEERecords = recordsResult.data; } else { allOEERecords = []; }
    }

    async function saveLibrary() { await apiCall('save_library', 'POST', { library: libraryKegiatan }); }

        allOEERecords.unshift(newRecord);
        await saveRecords();

        const index = allOEERecords.findIndex(r => r.id === recordId);
        if (index !== -1) {

    function getFilteredRecords() {
        return allOEERecords.filter(r => {
            if (!r.date) return false;
            const rDate = new Date(r.date);
            const sDate = new Date(filters.startDate);
            const eDate = new Date(filters.endDate);
            eDate.setHours(23, 59, 59);
            if (!(rDate >= sDate && rDate <= eDate)) return false;
            if (filters.shift !== 'all' && r.shift !== filters.shift) return false;
            if (filters.line !== 'all' && r.line_name !== filters.line) return false;
            if (filters.pic !== 'all') {
                let allPackerIds = [];
                r.kegiatan_data?.forEach(k => {
                    if (k.packers) allPackerIds = [...allPackerIds, ...k.packers];
                });
                if (!allPackerIds.some(p => p === filters.pic)) return false;
            }
            return true;
        });
    }
    
    function calculateMetrics(records) {
        if (!records.length) return { avgOEEActual: 0, avgOEE365: 0, totalOutput: 0 };
        const avgOEEActual = records.reduce((s, r) => s + parseFloat(r.oee_actual || 0), 0) / records.length;
        const avgOEE365 = records.reduce((s, r) => s + parseFloat(r.oee_365 || 0), 0) / records.length;
        const totalOutput = records.reduce((s, r) => s + parseInt(r.actual_output || 0), 0);
        return { avgOEEActual, avgOEE365, totalOutput };
    }
    
    // ==================== PERHITUNGAN OEE ====================
    function hitungResume(kegiatanList, lineId) {
        let totalODT = 0, totalRunning = 0, totalLineStopMesin = 0, totalLineStopNonMesin = 0, odtExceeds = [];
        const line = allLines.find(l => l.id === lineId);
        
        kegiatanList.forEach(k => {
            const dur = hitungDurasi(k.dari, k.jam);
            if (k.kode === 2) totalRunning += dur;
            else if (k.kode === 3) totalLineStopMesin += dur;
            else if (k.kode === 9) totalLineStopNonMesin += dur;
            else if ([1,5,6,7,8].includes(k.kode)) {
                let standarDurasi = 0;
                if (line?.activities && line.activities[k.kode]) {
                    const kegiatan = line.activities[k.kode].find(a => a.nama === k.kegiatan);
                    standarDurasi = kegiatan?.durasi || 0;
                }
                if (standarDurasi > 0 && dur > standarDurasi) {
                    totalODT += standarDurasi;
                    const exceed = dur - standarDurasi;
                    totalLineStopNonMesin += exceed;
                    odtExceeds.push({ item: k.kegiatan, standardTime: standarDurasi, actualTime: dur, exceed: exceed });
                } else {
                    totalODT += dur;
                }
            }
        });
        return { totalODT, totalRunning, totalLineStopMesin, totalLineStopNonMesin, odtExceeds };
    }
    
    function isLineTargetZero() {
        const line = allLines.find(l => l.id === selectedLineId);
        return line && (line.target === 0 || line.target === null || line.target === undefined);
    }
    
    function isWRRequired(kegiatan) {
        if (kegiatan.kode !== 3) return false;
        const durasi = hitungDurasi(kegiatan.dari, kegiatan.jam);
        return durasi > CONFIG.WR_THRESHOLD_MINUTES;
    }
    
    function getWRStatus(kegiatan) {
        if (kegiatan.kode !== 3) return null;
        const durasi = hitungDurasi(kegiatan.dari, kegiatan.jam);
        return {
            required: durasi > CONFIG.WR_THRESHOLD_MINUTES,
            duration: durasi,
            threshold: CONFIG.WR_THRESHOLD_MINUTES
        };
    }
    
    // ==================== HITUNG AVAILABILITY & OEE ====================
    function hitungAvailAndOEE(kegiatanList, batches, selectedShift, lineId) {
        const resume = hitungResume(kegiatanList, lineId);
        const totalDurasi = getTotalDurasiKegiatan();
        const totalRunning = resume.totalRunning;
        const totalODT = resume.totalODT;
        const totalLSM = resume.totalLineStopMesin;
        const totalLSNM = resume.totalLineStopNonMesin;
        
        const line = allLines.find(l => l.id === lineId);
        const targetPerPacker = line?.target || 0;
        const totalTargetOutput = hitungTotalTargetOutput(kegiatanList, lineId);
        const totalGood = getTotalOutputFromPacker();
        const totalReject = getTotalReject();
        const isZeroTarget = targetPerPacker === 0 || totalTargetOutput === 0;
        
        let perf, quality;
        if (isZeroTarget) { perf = 100; quality = 100; } else {
            perf = (totalGood / totalTargetOutput) * 100;
            quality = totalGood > 0 ? ((totalGood - totalReject) / totalGood) * 100 : 100;
        }
        if (perf > 100) perf = 100;
        if (quality > 100) quality = 100;
        
        const avail365 = totalDurasi > 0 ? (totalRunning / totalDurasi) * 100 : 0;
        const availActual = totalDurasi > 0 ? ((totalRunning + totalODT) / totalDurasi) * 100 : 0;
        const oeeActual = (availActual * perf * quality) / 10000;
        const oee365 = (avail365 * perf * quality) / 10000;
        const sisaJamKerja = totalDurasi - totalODT - totalLSM - totalLSNM - totalRunning;
        
        const runningActivities = kegiatanList.filter(k => k.kode === 2);
        const targetDetails = runningActivities.map(k => {
            const durasi = hitungDurasi(k.dari, k.jam);
            const jumlahPacker = k.packers ? k.packers.length : 0;
            const targetKegiatan = durasi * targetPerPacker * jumlahPacker;
            return {
                dari: k.dari,
                jam: k.jam,
                durasi: durasi,
                packer: jumlahPacker,
                target: targetKegiatan,
                packerNames: getPackerNames(k.packers || [])
            };
        });
        
        return {
            availActual, avail365, perf, quality,
            oee: oeeActual, oee365,
            sisaJamKerja, totalGood, totalReject,
            totalODT, totalLSM, totalLSNM,
            totalRunning, totalDurasi,
            totalTargetOutput, targetPerPacker,
            targetDetails,
            odtExceeds: resume.odtExceeds,
            isZeroTarget
        };
    }
    
    // ==================== DASHBOARD METRICS ====================
    function calculateTotalMetrics(records) {
        let totalODT = 0, totalLSM = 0, totalLSNM = 0, totalRunning = 0, totalMinorStop = 0;
        records.forEach(r => {
            if (r.odt_data) {
                r.odt_data.forEach(odt => {
                    if (odt.checked) {
                        const actual = parseFloat(odt.actualTime) || 0;
                        const standard = parseFloat(odt.standardTime) || 0;
                        totalODT += Math.min(actual, standard);
                    }
                });
            }
            if (r.line_stop_mesin_data) {
                r.line_stop_mesin_data.forEach(ls => { totalLSM += parseFloat(ls.duration) || 0; });
            }
            if (r.line_stop_non_mesin_data) {
                r.line_stop_non_mesin_data.forEach(ls => { totalLSNM += parseFloat(ls.duration) || 0; });
            }
            if (r.kegiatan_data) {
                r.kegiatan_data.forEach(k => {
                    if (k.kode === 2) {
                        const dur = hitungDurasi(k.dari, k.jam);
                        totalRunning += dur;
                    }
                });
            }
            if (r.minor_stop_data) {
                r.minor_stop_data.forEach(ms => { totalMinorStop += parseInt(ms.frequency) || 0; });
            }
        });
        const totalDurasi = totalRunning + totalODT + totalLSM + totalLSNM;
        return { totalODT, totalLSM, totalLSNM, totalRunning, totalMinorStop, totalDurasi };
    }
    
    function getParetoData(records) {
        const lsmCount = {};
        records.forEach(r => {
            if (r.line_stop_mesin_data) {
                r.line_stop_mesin_data.forEach(ls => {
                    const item = ls.item || 'Unknown';
                    const dur = parseFloat(ls.duration) || 0;
                    if (!lsmCount[item]) lsmCount[item] = 0;
                    lsmCount[item] += dur;
                });
            }
        });
        return Object.entries(lsmCount).map(([name, duration]) => ({ name, duration })).sort((a, b) => b.duration - a.duration).slice(0, 10);
    }
    
    function getOEEPerShift(records) {
        const shiftData = {};
        records.forEach(r => {
            if (!r.shift) return;
            if (!shiftData[r.shift]) shiftData[r.shift] = { total: 0, count: 0 };
            shiftData[r.shift].total += parseFloat(r.oee_actual || 0);
            shiftData[r.shift].count += 1;
        });
        return Object.entries(shiftData).map(([shift, data]) => ({ shift, avgOEE: data.total / data.count }));
    }
    
    function getMonthlyTrendData(records) {
        const currentYear = new Date().getFullYear();
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        const monthlyData = Array(12).fill().map(() => []);
        records.forEach(r => {
            if (!r.date) return;
            const recordYear = new Date(r.date).getFullYear();
            if (recordYear !== currentYear) return;
            const month = new Date(r.date).getMonth();
            monthlyData[month].push(parseFloat(r.oee_actual || 0));
        });
        const monthlyAvg = monthlyData.map(arr => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : null);
        return { months: monthNames, values: monthlyAvg };
    }
    
    function getPerLineData(records) {
        const lineStats = {};
        records.forEach(r => {
            if (!r.line_name) return;
            if (!lineStats[r.line_name]) lineStats[r.line_name] = { total: 0, count: 0 };
            lineStats[r.line_name].total += parseFloat(r.oee_actual || 0);
            lineStats[r.line_name].count += 1;
        });
        return Object.entries(lineStats).map(([name, stats]) => ({ name, avg: stats.total / stats.count })).sort((a, b) => b.avg - a.avg);
    }
    
    function getRunningPercentage(records) {
        const totalMetrics = calculateTotalMetrics(records);
        const totalDurasi = totalMetrics.totalDurasi || 0;
        if (totalDurasi === 0) return { percentage: 0, running: 0, total: 0 };
        return { percentage: (totalMetrics.totalRunning / totalDurasi) * 100, running: totalMetrics.totalRunning, total: totalDurasi };
    }
    
    function getAPQTrend(records) {
        const currentYear = new Date().getFullYear();
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        const monthlyData = Array(12).fill().map(() => ({ a: [], p: [], q: [] }));
        records.forEach(r => {
            if (!r.date) return;
            const recordYear = new Date(r.date).getFullYear();
            if (recordYear !== currentYear) return;
            const month = new Date(r.date).getMonth();
            monthlyData[month].a.push(parseFloat(r.availability_actual) || 0);
            monthlyData[month].p.push(parseFloat(r.performance) || 0);
            monthlyData[month].q.push(parseFloat(r.quality) || 0);
        });
        return monthlyData.map((data, i) => ({
            month: monthNames[i],
            avgA: data.a.length ? data.a.reduce((s,v) => s+v, 0) / data.a.length : null,
            avgP: data.p.length ? data.p.reduce((s,v) => s+v, 0) / data.p.length : null,
            avgQ: data.q.length ? data.q.reduce((s,v) => s+v, 0) / data.q.length : null
        }));
    }
    
    function getQualityTrend(records) {
        const currentYear = new Date().getFullYear();
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        const monthlyData = Array(12).fill().map(() => ({ good: 0, reject: 0, count: 0 }));
        records.forEach(r => {
            if (!r.date) return;
            const recordYear = new Date(r.date).getFullYear();
            if (recordYear !== currentYear) return;
            const month = new Date(r.date).getMonth();
            monthlyData[month].good += parseInt(r.actual_output || 0);
            monthlyData[month].reject += parseInt(r.reject || 0);
            monthlyData[month].count += 1;
        });
        return monthlyData.map((data, i) => ({
            month: monthNames[i],
            rejectRate: data.good > 0 ? (data.reject / (data.good + data.reject)) * 100 : 0,
            totalReject: data.reject,
            totalGood: data.good
        }));
    }

            const minorStopCtx = document.getElementById('chart-minor-stop');
            if (minorStopCtx) {
                const minorStopData = {};
                records.forEach(r => {
                    if (r.minor_stop_data) {
                        r.minor_stop_data.forEach(ms => {
                            const item = ms.item || 'Unknown';
                            const freq = parseInt(ms.frequency) || 0;
                            if (!minorStopData[item]) minorStopData[item] = 0;
                            minorStopData[item] += freq;
                        });
                    }
                });
                const sortedData = Object.entries(minorStopData).sort((a, b) => b[1] - a[1]).slice(0, 10);
                const colors = ['#f59e0b', '#ef4444', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316', '#6366f1', '#84cc16'];
                chartInstances.minorStop = new Chart(minorStopCtx, {
                    type: 'bar',
                    data: {
                        labels: sortedData.map(d => d[0].length > 20 ? d[0].substring(0,20)+'...' : d[0]),
                        datasets: [{
                            label: 'Frekuensi Minor Stop',
                            data: sortedData.map(d => d[1]),
                            backgroundColor: sortedData.map((_, i) => colors[i % colors.length])
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
                        plugins: {
                            datalabels: {
                                anchor: 'center', align: 'center', color: '#fff', font: { weight: 'bold', size: 12 },
                                formatter: function(value) { return value > 0 ? value : ''; },
                                filter: function(context) { return context.dataset.data[context.dataIndex] > 0; }
                            }
                        }
                    },
                    plugins: [ChartDataLabels]
                });
            }
        }, 200);
    }
    
    // ==================== SHOW RECORD DETAIL ====================
    function showRecordDetail(record) {
        let odtItemsHTML = '', totalODT = 0;
        if (record.odt_data && record.odt_data.length) {
            record.odt_data.forEach(odt => {
                if (odt.checked) {
                    const actual = parseFloat(odt.actualTime) || 0;
                    const standard = parseFloat(odt.standardTime) || 0;
                    const used = Math.min(actual, standard);
                    totalODT += used;
                    const exceed = actual > standard ? actual - standard : 0;
                    odtItemsHTML += `<div class="detail-item"><div class="detail-item-label">${odt.name}</div><div class="detail-item-value">${used.toFixed(1)} menit (Standar: ${standard} menit)</div>${exceed > 0 ? `<div style="color: #f59e0b; font-size: 12px; margin-top: 4px;">⚠️ Exceed: +${exceed.toFixed(1)} menit → LSNM</div>` : ''}</div>`;
                }
            });
        }
        
        let totalLSM = 0, lsmItemsHTML = '';
        if (record.line_stop_mesin_data && record.line_stop_mesin_data.length) {
            record.line_stop_mesin_data.forEach(ls => {
                const dur = parseFloat(ls.duration) || 0;
                totalLSM += dur;
                const wrText = ls.wr ? ` (WR: ${ls.wr})` : '';
                lsmItemsHTML += `<div class="detail-item"><div class="detail-item-label">${ls.item}</div><div class="detail-item-value">${dur.toFixed(1)} menit${wrText}</div></div>`;
            });
        }
        
        let totalLSNM = 0, lsnmItemsHTML = '';
        if (record.line_stop_non_mesin_data && record.line_stop_non_mesin_data.length) {
            record.line_stop_non_mesin_data.forEach(ls => {
                const dur = parseFloat(ls.duration) || 0;
                totalLSNM += dur;
                lsnmItemsHTML += `<div class="detail-item"><div class="detail-item-label">${ls.item}</div><div class="detail-item-value">${dur.toFixed(1)} menit</div></div>`;
            });
        }
        
        let msItemsHTML = '';
        let totalMinorStop = 0;
        if (record.minor_stop_data && record.minor_stop_data.length) {
            record.minor_stop_data.forEach(ms => {
                const freq = parseInt(ms.frequency) || 0;

                msItemsHTML += `<div class="detail-item"><div class="detail-item-label">${ms.item}</div><div class="detail-item-value">${freq} kali</div></div>`;

        let outputHTML = '';

                outputHTML += `</div>`;

        const modalContent = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="font-size: 24px; font-weight: 700; color: #be185d;">📋 Detail OEE Record</h3>
                <button class="btn btn-secondary" onclick="closeModal()" style="padding: 8px 16px;">✕ Tutup</button>
            </div>
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px;">
                <div class="detail-item"><div class="detail-item-label">Tanggal</div><div class="detail-item-value">${formatDate(record.date)}</div></div>
                <div class="detail-item"><div class="detail-item-label">Shift</div><div class="detail-item-value">${record.shift || '-'}</div></div>
                <div class="detail-item"><div class="detail-item-label">Line</div><div class="detail-item-value">${record.line_name || '-'}</div></div>
                <div class="detail-item"><div class="detail-item-label">Batches</div><div class="detail-item-value">${record.batch_data ? record.batch_data.map(b => b.batch).join(', ') || '-' : '-'}</div></div>
                <div class="detail-item"><div class="detail-item-label">Output / Reject</div><div class="detail-item-value">${record.actual_output || 0} / ${record.reject || 0}</div></div>
                <div class="detail-item"><div class="detail-item-label">SPV Approval</div><div class="detail-item-value">${record.spv_approved ? `<span class="approval-badge">✅ ${record.spv_inisial || 'SPV'}</span>` : '-'}</div></div>

            ${outputHTML}

                <div class="detail-item"><div class="detail-item-label">Availability Actual</div><div class="detail-item-value ${(parseFloat(record.availability_actual) || 0) >= CONFIG.A_TARGET ? 'badge-success' : 'badge-danger'}">${(parseFloat(record.availability_actual) || 0).toFixed(1)}%</div></div>

                <div class="detail-item"><div class="detail-item-label">Performance</div><div class="detail-item-value">${(parseFloat(record.performance) || 0).toFixed(1)}%</div></div>

    function submitSPVApproval() {
        const password = document.getElementById('spv-password')?.value;
        const inisial = document.getElementById('spv-inisial')?.value.toUpperCase().trim();
        if (!password || !inisial) {
            const errorEl = document.getElementById('spv-error');
            errorEl.textContent = '❌ Password dan inisial wajib diisi!';
            errorEl.style.display = 'block';
            return;
        }
        if (password !== CONFIG.SPV_PASSWORD) {
            const errorEl = document.getElementById('spv-error');
            errorEl.textContent = '❌ Password SPV salah!';
            errorEl.style.display = 'block';
            return;
        }
        spvApproved = true;
        spvInisial = inisial;
        closeModal();
        renderApp();
        showToast('✅ SPV Approved by: ' + inisial, 'success');
        simpanData();
    }

    // ==================== UPDATE OUTPUT PER PACKER ====================
    function updateOutputPerPacker() {
        const goodInputs = document.querySelectorAll('.packer-good-input');
        
        goodInputs.forEach(input => {
            const packerId = input.getAttribute('data-packer');
            if (!outputPerPacker[packerId]) outputPerPacker[packerId] = { good: 0 };
            outputPerPacker[packerId].good = parseInt(input.value) || 0;
        });
        
        // Update total display
        const totalGoodEl = document.getElementById('total-good-packer');
        const totalRejectEl = document.getElementById('total-reject-display');
        if (totalGoodEl) totalGoodEl.textContent = getTotalOutputFromPacker();
        if (totalRejectEl) totalRejectEl.textContent = getTotalReject();
        
        // Update OEE Live tanpa render ulang
        updateOEELive();
    }
    
    function updateGlobalReject(value) {
        globalReject = parseInt(value) || 0;
        const totalRejectEl = document.getElementById('total-reject-display');
        if (totalRejectEl) totalRejectEl.textContent = globalReject;
        
        // Update OEE Live tanpa render ulang
        updateOEELive();
    }
    
    // ==================== RENDER INPUT PAGE ====================
    function renderInputPage() {
        const lineTerpilih = allLines.find(l => l.id === selectedLineId);
        const isZeroTarget = isLineTargetZero();
        const oeeData = selectedShift && selectedLineId ? hitungAvailAndOEE(kegiatanList, batches, selectedShift, selectedLineId) : { 
            availActual: 0, avail365: 0, perf: 0, quality: 0, oee: 0, oee365: 0, 
            sisaJamKerja: 0, totalGood: 0, totalReject: 0, totalODT: 0, totalLSM: 0, totalLSNM: 0, 
            totalRunning: 0, totalDurasi: 0, totalTargetOutput: 0, targetPerPacker: 0,
            targetDetails: [], odtExceeds: [], isZeroTarget: false 
        };
        const resume = selectedLineId ? hitungResume(kegiatanList, selectedLineId) : { totalODT: 0, totalRunning: 0, totalLineStopMesin: 0, totalLineStopNonMesin: 0, odtExceeds: [] };
        const totalDurasi = getTotalDurasiKegiatan();
        const totalPacker = hitungTotalPacker(kegiatanList);
        const totalTargetOutput = oeeData.totalTargetOutput || 0;
        const targetPerPacker = getLineTarget(selectedLineId);
        const isPerfBelow100 = oeeData.perf < 100 && oeeData.perf > 0;
        const needsApproval = isPerfBelow100 && !spvApproved;
        
        const minorStopItems = lineTerpilih?.minor_stop || [];
        const lastPackers = getLastSelectedPackers();
        
        // ===== AMBIL PACKER UNIQUE DARI KODE 2 =====
        const runningPackers = getUniqueRunningPackers();
        const totalGood = getTotalOutputFromPacker();
        const totalReject = getTotalReject();
        const totalGoodDisplay = isZeroTarget ? '-' : totalGood;
        const totalRejectDisplay = isZeroTarget ? '-' : totalReject;
        
        const odtExceedsHTML = resume.odtExceeds.length > 0 ? `
            <div class="mt-3 p-3 bg-orange-50 rounded-lg border border-orange-300">
                <p class="text-sm text-orange-700 font-semibold"><i class="fas fa-exclamation-triangle"></i> ODT Exceed (Otomatis masuk ke Line Stop Non Mesin):</p>
                ${resume.odtExceeds.map(ex => `<div class="text-xs text-orange-600 mt-1">• ${ex.item}: ${ex.actualTime.toFixed(1)} menit (Standar ${ex.standardTime} menit) → Kelebihan ${ex.exceed.toFixed(1)} menit masuk LSNM</div>`).join('')}
            </div>
        ` : '';
        
        let wrRequiredItems = [];
        kegiatanList.forEach((k, index) => {
            if (k.kode === 3) {
                const durasi = hitungDurasi(k.dari, k.jam);
                if (durasi > CONFIG.WR_THRESHOLD_MINUTES) {
                    wrRequiredItems.push({ index, durasi, item: k.kegiatan });
                }
            }
        });
        
        const wrWarningHTML = wrRequiredItems.length > 0 ? `
            <div class="mt-3 p-3 bg-red-50 rounded-lg border border-red-400">
                <p class="text-sm text-red-700 font-semibold"><i class="fas fa-exclamation-circle"></i> ⚠️ WR WAJIB DIISI untuk Line Stop > ${CONFIG.WR_THRESHOLD_MINUTES} menit:</p>
                ${wrRequiredItems.map(w => `<div class="text-xs text-red-600 mt-1">• ${w.item} (${w.durasi} menit) → <span class="font-bold">WAJIB isi WR</span></div>`).join('')}
            </div>
        ` : '';

        // Render output per packer hanya untuk packer yang ada di running (kode 2)
        let outputPerPackerHTML = '';
        if (runningPackers.length === 0) {
            outputPerPackerHTML = '<div class="text-xs text-gray-400 col-span-full">Belum ada packer pada kegiatan running (KODE 2).</div>';
        } else {
            // Pastikan semua running packer ada di outputPerPacker
            runningPackers.forEach(packerId => {
                if (!outputPerPacker[packerId]) {
                    outputPerPacker[packerId] = { good: 0 };
                }
            });
            
            outputPerPackerHTML = runningPackers.map(packerId => {
                const name = getPackerName(packerId);
                const data = outputPerPacker[packerId] || { good: 0 };
                return `<div class="packer-output-item">
                    <span class="label">${name}</span>
                    <input type="number" class="packer-good-input" data-packer="${packerId}" value="${data.good || 0}" placeholder="GOOD" min="0" ${isZeroTarget ? 'disabled' : ''}>
                </div>`;
            }).join('');
        }

        const minorStopHTML = `
            <div class="card">
                <h3 class="font-bold mb-4">⏸️ MINOR STOP</h3>
                ${minorStopItems.length === 0 ? `
                    <div class="text-center py-4 bg-gray-50 rounded-lg">
                        <p class="text-gray-400 text-sm">Belum ada item minor stop untuk line ini</p>
                        <p class="text-xs text-gray-400 mt-1">Atur di Management → Edit Line → Minor Stop Items</p>
                    </div>
                ` : `
                    <div id="minor-stop-container" class="space-y-2 mb-3">
                        ${minorStopData.map((ms, i) => `
                            <div class="flex gap-3 p-3 bg-gray-50 rounded-xl items-center flex-wrap">
                                <select class="input-field flex-1" onchange="updateMinorStop(${i}, 'item', this.value)">
                                    <option value="">PILIH MINOR STOP</option>
                                    ${minorStopItems.map(item => `
                                        <option value="${item}" ${ms.item === item ? 'selected' : ''}>${item}</option>
                                    `).join('')}
                                </select>
                                <input type="number" class="input-field w-32" value="${ms.frequency || ''}" placeholder="FREKUENSI" min="1" onchange="updateMinorStop(${i}, 'frequency', this.value)">
                                <button class="btn btn-secondary" onclick="hapusMinorStop(${i})"><i class="fas fa-trash"></i></button>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn btn-secondary w-full" onclick="tambahMinorStop()"><i class="fas fa-plus"></i> TAMBAH MINOR STOP</button>
                    <div class="mt-3 text-xs text-gray-400">Total Minor Stop: <span id="total-minor-stop">${minorStopData.reduce((s, ms) => s + (parseInt(ms.frequency) || 0), 0)}</span> kali</div>
                `}
            </div>
        `;

        const targetDetailsHTML = oeeData.targetDetails && oeeData.targetDetails.length > 0 ? `
            <div class="mt-3 p-3 bg-blue-50 rounded-lg border border-blue-200">
                <p class="text-xs text-blue-700 font-semibold mb-2">📊 Detail Target per Running:</p>
                ${oeeData.targetDetails.map(t => `
                    <div class="text-xs text-blue-600 flex justify-between items-center border-b border-blue-100 py-1">
                        <span>${t.dari} - ${t.jam} (${t.durasi} min)</span>
                        <span>${t.packer} packer × ${targetPerPacker} = ${t.target.toFixed(0)} dus</span>
                        <span class="text-gray-400">${t.packerNames.join(', ')}</span>
                    </div>
                `).join('')}
                <div class="text-xs text-blue-700 font-bold mt-2">Total Target: ${totalTargetOutput.toFixed(0)} dus</div>
            </div>
        ` : '';

        return `
            <div class="gradient-bg text-white p-4 shadow-lg" style="border-radius: 0 0 30px 30px;">
                <div class="container flex justify-between items-center flex-wrap gap-3">
                    <div><h1 class="text-xl font-bold">OEE KEMAS SEKUNDER</h1><p class="text-white/80 text-xs mt-1">TKL SYSTEM</p></div>
                    <div class="text-right"><p class="text-sm font-semibold">${new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p></div>
                </div>
            </div>
            <div class="container py-4">
                <div class="nav-tabs">
                    <div class="nav-tab" onclick="navigateTo('dashboard')">📊 DASHBOARD</div>

                    <div class="nav-tab" onclick="navigateTo('management')">⚙️ MANAGEMENT</div>
                    <div class="nav-tab" onclick="navigateTo('admin')">🔐 ADMIN</div>
                </div>
                
                ${editMode ? `<div class="bg-yellow-50 border-l-4 border-yellow-400 p-3 mb-4 rounded-lg text-sm"><i class="fas fa-edit"></i> <span class="edit-mode-badge">EDIT MODE</span> Sedang mengedit ID: ${editingRecordId}</div>` : ''}
                ${needsApproval ? `<div class="bg-red-50 border-l-4 border-red-400 p-3 mb-4 rounded-lg text-sm"><p class="text-red-700 font-semibold"><i class="fas fa-lock"></i> ⚠️ PERFORMANCE < 100% - BUTUH APPROVAL SPV</p></div>` : ''}
                ${spvApproved ? `<div class="bg-green-50 border-l-4 border-green-400 p-3 mb-4 rounded-lg text-sm"><p class="text-green-700 font-semibold"><i class="fas fa-check-circle"></i> ✅ SPV APPROVED by: ${spvInisial}</p></div>` : ''}
                
                <!-- INFORMASI SHIFT + BATCH -->
                <div class="card">
                    <h3 class="font-bold mb-3 text-pink-700">📋 INFORMASI SHIFT</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div><label class="text-xs font-semibold text-gray-500">TANGGAL</label><input type="date" id="input-date" class="input-field" value="${selectedDate}" onchange="updateDateValue(this.value)"></div>
                        <div><label class="text-xs font-semibold text-gray-500">SHIFT</label><select id="input-shift" class="input-field" onchange="updateShiftValue(this.value)"><option value="">PILIH SHIFT</option>${Object.keys(SHIFTS).map(s => `<option value="${s}" ${selectedShift === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>

                    </div>
                    
                    <!-- BATCH HANYA NOMOR BATCH -->
                    <div class="mt-4 pt-4 border-t border-pink-200">
                        <div class="flex justify-between items-center mb-2 flex-wrap gap-2">
                            <label class="text-xs font-semibold text-gray-500">📦 BATCH</label>

                            ${batches.map((b, i) => `

                                </div>

                    </div>
                    <div id="kegiatan-list-container">
                        ${kegiatanList.length === 0 ? '<div class="text-center py-6 bg-pink-50 rounded-lg text-gray-400 text-sm">BELUM ADA KEGIATAN</div>' : kegiatanList.map((k, i) => {
                            const durasi = hitungDurasi(k.dari, k.jam);
                            const wrStatus = getWRStatus(k);
                            const isWRReq = wrStatus && wrStatus.required;
                            const wrValue = k.wr || '';
                            const packerNames = getPackerNames(k.packers || []);
                            const isRunning = k.kode === 2;
                            return `<div class="timeline-card">
                                <span class="kode-badge kode-${k.kode}">${k.kode}</span>
                                <div class="flex-1">
                                    <div><span class="font-semibold text-sm">${k.dari} - ${k.jam}</span> <span class="text-xs bg-pink-100 px-2 py-0.5 rounded">${KODE_TKL[k.kode]?.icon} ${KODE_TKL[k.kode]?.name}</span></div>
                                    <div class="text-xs">${k.kegiatan} ${durasi > 0 ? `(${durasi} min)` : ''}</div>
                                    ${k.activityNotes ? `<div class="text-xs text-gray-500">📝 ${k.activityNotes}</div>` : ''}
                                </div>
                                ${packerNames.length > 0 ? `
                                    <div class="packer-tags">
                                        ${packerNames.map(n => `<span class="packer-tag">👤 ${n}</span>`).join('')}
                                        ${isRunning ? `<span class="packer-count">${packerNames.length} ORANG → ${(durasi * targetPerPacker * packerNames.length).toFixed(0)} dus</span>` : ''}
                                    </div>
                                ` : ''}
                                ${k.kode === 3 ? `<div class="wr-field"><span class="wr-label">WR ${isWRReq ? '<span class="wr-required">*WAJIB</span>' : ''}:</span><input type="text" class="wr-input ${isWRReq ? 'required' : ''}" placeholder="No WR" value="${wrValue}" data-index="${i}" onchange="updateWR(${i}, this.value)" ${isWRReq ? 'required' : ''}>${isWRReq ? '<span class="wr-required-badge">REQUIRED</span>' : ''}</div>` : ''}
                                <button class="btn-remove" onclick="hapusKegiatan(${i})"><i class="fas fa-trash"></i></button>
                            </div>`;
                        }).join('')}
                    </div>
                    ${targetDetailsHTML}
                    ${wrWarningHTML}${odtExceedsHTML}
                </div>
                
                <!-- OUTPUT PER PACKER - HANYA PACKER DARI KODE 2 (RUNNING) -->
                <div class="card">
                    <h3 class="font-bold mb-3 text-pink-700">📦 OUTPUT PER PACKER</h3>
                    <div class="packer-output-grid" id="packer-output-container">

                    ${runningPackers.length > 0 ? `
                        <div class="text-xs text-gray-400 mt-2">* Hanya menampilkan packer yang terlibat pada kegiatan RUNNING (KODE 2)</div>

                    <!-- REJECT GLOBAL -->

                        <span class="text-sm font-semibold text-gray-500">❌ REJECT GLOBAL:</span>
                        <input type="number" id="global-reject-input" class="input-field input-field-sm w-24 text-center" value="${globalReject || 0}" min="0" ${isZeroTarget ? 'disabled' : ''}>
                        <span class="text-xs text-gray-400">(Reject total semua packer)</span>
                    </div>
                    
                    <div class="mt-3 flex gap-4 flex-wrap">
                        <div class="text-sm">
                            <span class="text-gray-500">Total Good:</span>
                            <span class="font-bold text-blue-600 text-lg" id="total-good-packer">${totalGoodDisplay}</span>
                        </div>
                        <div class="text-sm">
                            <span class="text-gray-500">Total Reject:</span>
                            <span class="font-bold text-red-600 text-lg" id="total-reject-display">${totalRejectDisplay}</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">

                    <div class="resume-card"><div class="resume-label">RUNNING</div><div class="resume-value text-green-600">${resume.totalRunning} MIN</div></div>
                    <div class="resume-card"><div class="resume-label">LS MESIN</div><div class="resume-value text-red-600">${resume.totalLineStopMesin} MIN</div></div>
                    <div class="resume-card"><div class="resume-label">LS NON MESIN</div><div class="resume-value text-orange-600">${resume.totalLineStopNonMesin} MIN</div></div>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3">
                    <div class="resume-card"><div class="resume-label">TOTAL DURASI</div><div class="resume-value text-purple-600">${totalDurasi} MIN</div></div>
                    <div class="resume-card"><div class="resume-label">TOTAL PACKER</div><div class="resume-value text-pink-600">${totalPacker} ORANG</div></div>

                    <div class="resume-card"><div class="resume-label">TARGET/PACKER</div><div class="resume-value text-emerald-600">${targetPerPacker} DUS/MIN</div></div>

                <div class="card bg-gradient-to-r from-pink-50 to-purple-50">
                    <h3 class="font-bold mb-3 text-pink-700">📊 OEE LIVE ${isZeroTarget ? '<span class="badge-info" style="font-size:10px;margin-left:6px;">⚡ Perf 100%</span>' : ''}</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                        <div class="oee-card"><div class="oee-label">AVAILABILITY ACTUAL</div><div class="oee-value ${oeeData.availActual >= CONFIG.A_TARGET ? 'text-green-600' : 'text-red-600'}" id="live-avail-actual">${oeeData.availActual.toFixed(1)}%</div><div class="oee-sub">(Running+ODT)/Durasi</div></div>
                        <div class="oee-card"><div class="oee-label">AVAILABILITY 365</div><div class="oee-value" id="live-avail-365">${oeeData.avail365.toFixed(1)}%</div><div class="oee-sub">Running/Durasi</div></div>
                        <div class="oee-card ${isZeroTarget ? 'bg-green-50 border-green-400' : ''}"><div class="oee-label">PERFORMANCE</div><div class="oee-value" id="live-perf" style="color: ${isZeroTarget ? '#10b981' : (oeeData.perf >= CONFIG.P_TARGET ? '#10b981' : '#ef4444')}">${isZeroTarget ? '100.0%' : oeeData.perf.toFixed(1)}%</div>${oeeData.perf < 100 && oeeData.perf > 0 ? '<div class="oee-sub text-red-500 font-semibold">⚠️ Perlu SPV</div>' : ''}</div>
                        <div class="oee-card ${isZeroTarget ? 'bg-green-50 border-green-400' : ''}"><div class="oee-label">QUALITY</div><div class="oee-value" id="live-qual" style="color: ${isZeroTarget ? '#10b981' : (oeeData.quality >= CONFIG.Q_TARGET ? '#10b981' : '#ef4444')}">${isZeroTarget ? '100.0%' : oeeData.quality.toFixed(1)}%</div></div>
                        <div class="oee-card oee-card-large"><div class="oee-label">OEE ACTUAL</div><div class="oee-value" id="live-oee" style="color: ${oeeData.oee >= CONFIG.OEE_TARGET ? '#10b981' : '#ef4444'}">${oeeData.oee.toFixed(1)}%</div></div>

                <div class="flex flex-wrap justify-end gap-2 mt-4">
                    <button class="btn btn-secondary" onclick="resetForm()" ${editMode ? '' : 'style="display:none"'}>BATAL EDIT</button>
                    ${needsApproval ? `<button class="btn btn-warning" onclick="showSPVApprovalModal()"><i class="fas fa-lock"></i> APPROVAL SPV</button>` : ''}
                    <button class="btn btn-primary" onclick="simpanData()" ${needsApproval ? 'disabled' : ''}><i class="fas fa-save"></i> ${editMode ? 'UPDATE' : 'SIMPAN'}</button>
                </div>
                ${needsApproval ? '<div class="text-center text-xs text-red-600 mt-2">⚠️ Performance < 100%, butuh approval SPV</div>' : ''}
            </div>
        `;
    }

                <div class="container flex justify-between items-center flex-wrap gap-3">

    // ==================== RENDER ADMIN PAGE ====================
    function renderAdminPage() {
        const records = getFilteredRecords();
        
        let trackingData = [];
        records.forEach(r => {
            if (r.kegiatan_data && r.kegiatan_data.length) {
                r.kegiatan_data.forEach(k => {
                    const startDate = r.date + ' ' + (k.dari || '00:00');
                    const endDate = r.date + ' ' + (k.jam || '00:00');
                    const durasi = hitungDurasi(k.dari || '00:00', k.jam || '00:00');
                    const packerNames = getPackerNames(k.packers || []);
                    trackingData.push({
                        startDate: startDate,
                        endDate: endDate,
                        durasi: durasi,
                        kode: k.kode || '-',
                        kegiatan: k.kegiatan || '-',
                        notes: k.activityNotes || '',
                        shift: r.shift || '-',
                        line: r.line_name || '-',
                        packers: packerNames.join(', ') || '-'
                    });
                });
            }
        });
        
        trackingData.sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
        
        let filteredTrackingData = [];
        let showTracking = false;
        let selectedRecordData = null;
        if (window._selectedRecordId) {
            showTracking = true;
            selectedRecordData = allOEERecords.find(r => r.id === window._selectedRecordId);
            if (selectedRecordData && selectedRecordData.kegiatan_data) {
                const kegiatanTimes = selectedRecordData.kegiatan_data.map(k => ({ dari: k.dari, jam: k.jam }));
                filteredTrackingData = trackingData.filter(t => {
                    return kegiatanTimes.some(kt => t.startDate.includes(kt.dari) && t.endDate.includes(kt.jam));
                });
            }
        }
        
        return `
            <div class="gradient-bg text-white p-4 shadow-lg" style="border-radius: 0 0 30px 30px;">
                <div class="container flex justify-between items-center flex-wrap gap-3">
                    <div><h1 class="text-xl font-bold">🔐 ADMINISTRATOR</h1><p class="text-white/80 text-xs mt-1">Panel Administrator</p></div>
                    <div class="text-right"><p class="text-sm font-semibold">${new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p></div>
                </div>
            </div>
            <div class="container py-4">
                <div class="nav-tabs">
                    <div class="nav-tab" onclick="navigateTo('dashboard')">📊 DASHBOARD</div>
                    <div class="nav-tab" onclick="navigateTo('input')">✏️ INPUT TKL</div>
                    <div class="nav-tab" onclick="navigateTo('management')">⚙️ MANAGEMENT</div>
                    <div class="nav-tab active">🔐 ADMIN</div>
                </div>
                
                <div class="card">
                    <div class="card-header">🔍 Filter Data</div>
                    <div class="filter-section">
                        <div><label class="block text-xs mb-1">Start Date</label><input type="date" class="input-field input-field-sm" value="${filters.startDate}" onchange="updateFilter('startDate', this.value)"></div>
                        <div><label class="block text-xs mb-1">End Date</label><input type="date" class="input-field input-field-sm" value="${filters.endDate}" onchange="updateFilter('endDate', this.value)"></div>
                        <div><label class="block text-xs mb-1">Shift</label><select class="input-field input-field-sm" onchange="updateFilter('shift', this.value)"><option value="all">Semua Shift</option>${Object.keys(SHIFTS).map(s => `<option value="${s}" ${filters.shift === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
                        <div><label class="block text-xs mb-1">Line</label><select class="input-field input-field-sm" onchange="updateFilter('line', this.value)"><option value="all">Semua Line</option>${allLines.map(l => `<option value="${l.name}" ${filters.line === l.name ? 'selected' : ''}>${l.name}</option>`).join('')}</select></div>
                        <div><label class="block text-xs mb-1">PIC</label><select class="input-field input-field-sm" onchange="updateFilter('pic', this.value)"><option value="all">Semua Packer</option>${allPackers.map(p => `<option value="${p.id}" ${filters.pic === p.id ? 'selected' : ''}>${p.nama}</option>`).join('')}</select></div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">📋 OEE History <span class="text-xs">(Klik baris untuk lihat tracking kegiatan)</span></div>
                    <div class="table-wrapper">
                        <table>
                            <thead><tr><th>Date</th><th>Shift</th><th>Line</th><th>Packer</th><th>Batches</th><th>Output</th><th>Reject</th><th>A%</th><th>P%</th><th>Q%</th><th>OEE%</th><th>SPV</th><th>Notes</th></tr></thead>
                            <tbody>
                                ${records.map(r => {
                                    let allPackerIds = [];

                                        if (k.packers) allPackerIds = [...allPackerIds, ...k.packers];
