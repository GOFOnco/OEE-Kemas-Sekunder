                                    const uniquePackers = [...new Set(allPackerIds)];
                                    const batchList = r.batch_data ? r.batch_data.map(b => b.batch).join(', ') : '-';
                                    return `
                                        <tr class="clickable-row ${window._selectedRecordId === r.id ? 'row-selected' : ''}" onclick='filterTrackingByRecord("${r.id}")' style="cursor:pointer;">
                                            <td>${formatDateShort(r.date)}</td>
                                            <td>${r.shift || '-'}</td>
                                            <td><strong>${r.line_name || '-'}</strong></td>
                                            <td>${uniquePackers.map(p => getPackerName(p)).join(', ') || '-'}</td>
                                            <td class="notes-wrap">${batchList}</td>
                                            <td>${(parseInt(r.actual_output) || 0).toLocaleString()}</td>
                                            <td>${parseInt(r.reject) || 0}</td>
                                            <td class="${(parseFloat(r.availability_actual) || 0) >= CONFIG.A_TARGET ? 'status-good' : 'status-bad'}">${(parseFloat(r.availability_actual) || 0).toFixed(1)}%</td>
                                            <td class="${(parseFloat(r.performance) || 0) >= CONFIG.P_TARGET ? 'status-good' : 'status-bad'}">${(parseFloat(r.performance) || 0).toFixed(1)}%</td>
                                            <td class="${(parseFloat(r.quality) || 0) >= CONFIG.Q_TARGET ? 'status-good' : 'status-bad'}">${(parseFloat(r.quality) || 0).toFixed(1)}%</td>
                                            <td class="${(parseFloat(r.oee_actual) || 0) >= CONFIG.OEE_TARGET ? 'status-good' : 'status-bad'}">${(parseFloat(r.oee_actual) || 0).toFixed(1)}%</td>
                                            <td>${r.spv_approved ? `<span class="approval-badge">✅ ${r.spv_inisial || 'SPV'}</span>` : '-'}</td>
                                            <td class="notes-wrap">${r.notes || '-'}</td>
                                        </tr>
                                    `;
                                }).join('')}
                                ${records.length === 0 ? '<tr><td colspan="13" class="text-center py-6">Belum ada data</td></tr>' : ''}
                            </tbody>
                        </table>
                    </div>
                </div>
                
                ${showTracking ? `
                    <div class="card" style="border-left: 4px solid #ec4899; animation: slideIn 0.3s ease;">
                        <div class="card-header">
                            <div class="card-header-left">
                                📋 TRACKING KEGIATAN 
                                <span class="text-xs bg-pink-100 text-pink-700 px-2 py-1 rounded-full">${filteredTrackingData.length} records</span>
                            </div>
                            <div class="flex gap-2 items-center">
                                <span class="text-xs text-gray-500">ID: ${window._selectedRecordId}</span>
                                <button class="btn btn-secondary text-xs py-1 px-3" onclick="clearTrackingFilter()">✕ Hapus Filter</button>
                            </div>
                        </div>
                        ${selectedRecordData ? `
                            <div class="mb-3 p-3 bg-pink-50 rounded-lg text-sm">
                                <span class="font-semibold">📅 ${formatDate(selectedRecordData.date)}</span>
                                <span class="mx-2">|</span>
                                <span>🏭 ${selectedRecordData.line_name || '-'}</span>
                                <span class="mx-2">|</span>
                                <span>📦 Output: ${selectedRecordData.actual_output || 0}</span>
                            </div>
                        ` : ''}
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr><th>Durasi</th><th>Start Date</th><th>End Date</th><th>Kode / Nama Kegiatan / Notes</th><th>Shift</th><th>Line</th><th>Packers</th></tr>
                                </thead>
                                <tbody>
                                    ${filteredTrackingData.length === 0 ? '<tr><td colspan="7" class="text-center py-6">Tidak ada tracking</td></tr>' : 
                                        filteredTrackingData.map(t => `
                                            <tr>
                                                <td>${t.durasi} min</td>
                                                <td>${formatDateTime(t.startDate)}</td>
                                                <td>${formatDateTime(t.endDate)}</td>
                                                <td>
                                                    <span class="kode-badge kode-${t.kode}" style="font-size:10px;padding:2px 8px;">${t.kode}</span> 
                                                    ${t.kegiatan}
                                                    ${t.notes ? `<div class="text-xs text-gray-500 mt-1">📝 ${t.notes}</div>` : ''}
                                                </td>
                                                <td>${t.shift}</td>
                                                <td>${t.line}</td>
                                                <td>${t.packers}</td>
                                            </tr>
                                        `).join('')
                                    }
                                </tbody>
                            </table>
                        </div>
                    </div>
                ` : `
                    <div class="card" style="border: 1px dashed #d1d5db; background: #fafafa;">
                        <div class="text-center py-6 text-gray-400">
                            <i class="fas fa-mouse-pointer text-2xl mb-2"></i>
                            <p>Klik salah satu baris OEE History di atas untuk melihat tracking kegiatan</p>
                        </div>
                    </div>
                `}
            </div>
        `;
    }
    
    // ==================== FUNGSI FILTER TRACKING ====================
    function filterTrackingByRecord(recordId) {
        if (window._selectedRecordId === recordId) {
            clearTrackingFilter();
            return;
        }
        window._selectedRecordId = recordId;
        renderApp();
        showToast('🔍 Menampilkan tracking untuk record: ' + recordId);
    }
    
    function clearTrackingFilter() {
        window._selectedRecordId = null;
        renderApp();
        showToast('Filter tracking dihapus');
    }
    
    // ==================== MANAGEMENT FUNCTIONS ====================
    function showTambahLineModal() {
        showModal(`
            <h3 class="text-xl font-bold mb-4">➕ TAMBAH LINE BARU</h3>
            <div class="space-y-3">
                <div><label class="text-xs font-semibold">NAMA LINE</label><input type="text" id="new-line-name" class="input-field mt-1" placeholder="CONTOH: LINE KEMAS ORAL"></div>
                <div><label class="text-xs font-semibold">TARGET (DUS/MENIT/PACKER)</label><input type="number" id="new-line-target" class="input-field mt-1" placeholder="5" step="0.1"></div>
                <div><label class="text-xs font-semibold">PIC</label><input type="text" id="new-line-pic" class="input-field mt-1" placeholder="NAMA PIC"></div>
                <div><label class="text-xs font-semibold">MINOR STOP ITEMS</label><input type="text" id="new-line-ms" class="input-field mt-1" placeholder="ETIKET PUTUS, CODING KERING"></div>
                <div class="mt-4 p-3 bg-blue-50 rounded-lg"><p class="text-sm text-blue-700"><i class="fas fa-info-circle"></i> Setelah line dibuat, atur kegiatannya.</p></div>
                <div class="flex gap-3 mt-4"><button class="btn btn-primary flex-1" onclick="saveNewLine()">SIMPAN</button><button class="btn btn-secondary flex-1" onclick="closeModal()">BATAL</button></div>
            </div>
        `);
    }
    
    async function saveNewLine() {
        const name = document.getElementById('new-line-name')?.value.toUpperCase();
        const target = parseFloat(document.getElementById('new-line-target')?.value) || 0;
        const pic = document.getElementById('new-line-pic')?.value.toUpperCase() || '';
        const msStr = document.getElementById('new-line-ms')?.value || '';
        const minorStop = msStr.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
        if (!name) { showToast('Nama line harus diisi', 'error'); return; }
        if (allLines.find(l => l.name === name)) { showToast('Nama line sudah ada', 'error'); return; }
        allLines.push({ id: 'line_' + Date.now().toString(), name, target, pic, minor_stop: minorStop, activities: {} });
        await saveLines();
        closeModal();
        renderApp();
        showToast('Line berhasil ditambahkan!');
    }
    
    function editLine(lineId) {
        const line = allLines.find(l => l.id === lineId);
        if (!line) return;
        showModal(`
            <h3 class="text-xl font-bold mb-4">✏️ EDIT LINE</h3>
            <div class="space-y-3">
                <div><label class="text-xs font-semibold">NAMA LINE</label><input type="text" id="edit-line-name" class="input-field mt-1" value="${line.name}"></div>
                <div><label class="text-xs font-semibold">TARGET</label><input type="number" id="edit-line-target" class="input-field mt-1" step="0.1" value="${line.target}"></div>
                <div><label class="text-xs font-semibold">PIC</label><input type="text" id="edit-line-pic" class="input-field mt-1" value="${line.pic || ''}"></div>
                <div><label class="text-xs font-semibold">MINOR STOP ITEMS</label><input type="text" id="edit-line-ms" class="input-field mt-1" value="${(line.minor_stop || []).join(', ')}"></div>
                <div class="flex gap-3 mt-4"><button class="btn btn-primary flex-1" onclick="updateLine('${lineId}')">UPDATE</button><button class="btn btn-secondary flex-1" onclick="closeModal()">BATAL</button></div>
            </div>
        `);
    }
    
    async function updateLine(lineId) {
        const name = document.getElementById('edit-line-name')?.value.toUpperCase();
        const target = parseFloat(document.getElementById('edit-line-target')?.value) || 0;
        const pic = document.getElementById('edit-line-pic')?.value.toUpperCase() || '';
        const msStr = document.getElementById('edit-line-ms')?.value || '';
        const minorStop = msStr.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
        if (!name) { showToast('Nama line harus diisi', 'error'); return; }
        const idx = allLines.findIndex(l => l.id === lineId);
        if (idx !== -1) {
            allLines[idx] = { ...allLines[idx], name, target, pic, minor_stop: minorStop };
            await saveLines();
            closeModal();
            renderApp();
            showToast('Line berhasil diupdate!');
        }
    }
    
    async function deleteLine(lineId) {
        if (confirm('Hapus line ini?')) {
            allLines = allLines.filter(l => l.id !== lineId);
            await saveLines();
            renderApp();
            showToast('Line dihapus');
        }
    }
    
    function editLineActivities(lineId) {
        const line = allLines.find(l => l.id === lineId);
        if (!line) return;
        let html = `<h3 class="text-xl font-bold mb-4">📋 ATUR KEGIATAN LINE: ${line.name}</h3>`;
        html += `<p class="text-sm text-gray-500 mb-4">Pilih kegiatan dari library. Untuk KODE 5, centang "Enable Notes".</p>`;
        ['1','2','3','5','6','7','8','9'].forEach(kode => {
            const libraryItems = libraryKegiatan[kode] || [];
            const currentActivities = line.activities?.[kode] || [];
            const isKode5 = kode === '5';
            html += `<div class="border rounded-lg p-3 mb-3 bg-gray-50">
                <div class="flex items-center gap-2 mb-2"><span class="kode-badge kode-${kode}">KODE ${kode}</span><span class="font-semibold">${KODE_TKL[kode]?.icon} ${KODE_TKL[kode]?.name}</span>${KODE_TKL[kode]?.hasDuration ? '<span class="text-xs text-blue-500 ml-2">(Bisa isi durasi)</span>' : ''}</div>
                <div class="space-y-2">`;
            if (libraryItems.length === 0) {
                html += `<div class="text-center text-gray-400 text-sm py-2">Belum ada kegiatan di library</div>`;
            } else {
                libraryItems.forEach(item => {
                    const currentActivity = currentActivities.find(a => a.nama === item);
                    const currentDurasi = currentActivity?.durasi || '';
                    const allowNotes = currentActivity?.allow_notes || false;
                    html += `<div class="flex items-center gap-3 p-2 bg-white rounded-lg flex-wrap">
                        <input type="checkbox" class="act-checkbox" data-kode="${kode}" data-nama="${item}" ${currentActivities.some(a => a.nama === item) ? 'checked' : ''}>
                        <span class="text-sm flex-1">${item}</span>
                        ${KODE_TKL[kode]?.hasDuration ? `<div class="flex items-center gap-1"><span class="text-xs text-gray-500">Durasi:</span><input type="number" class="duration-input" data-nama="${item}" data-kode="${kode}" value="${currentDurasi}" placeholder="menit"><span class="text-xs text-gray-500">min</span></div>` : ''}

    async function saveLineActivities(lineId) {
        const checkboxes = document.querySelectorAll('.act-checkbox');
        const newActivities = {};
        checkboxes.forEach(cb => {
            const kode = cb.getAttribute('data-kode');
            const nama = cb.getAttribute('data-nama');
            if (cb.checked) {
                if (!newActivities[kode]) newActivities[kode] = [];
                let durasi = null;
                const durInput = document.querySelector(`.duration-input[data-nama="${nama}"][data-kode="${kode}"]`);
                if (durInput && durInput.value) { durasi = parseInt(durInput.value); }
                let allowNotes = false;
                if (kode === '5') {
                    const notesCheckbox = document.querySelector(`.allow-notes-checkbox[data-nama="${nama}"][data-kode="${kode}"]`);

                }
                newActivities[kode].push({ nama, durasi: durasi && !isNaN(durasi) ? durasi : null, allow_notes: allowNotes });
            }
        });
        const index = allLines.findIndex(l => l.id === lineId);
        if (index !== -1) {
            allLines[index].activities = newActivities;

    function tambahKegiatanFromModal() {
        const packerCheckboxes = document.querySelectorAll('.packer-checkbox:checked');
        const selectedPackers = Array.from(packerCheckboxes).map(cb => cb.value);
        const dari = document.getElementById('modal-dari')?.value;
        const sampai = document.getElementById('modal-sampai')?.value;
        const sel = document.getElementById('modal-kegiatan-select');
        const wrInput = document.getElementById('modal-wr');
        const notesInput = document.getElementById('modal-notes');
        if (!sel?.value) { showToast('PILIH KEGIATAN', 'error'); return; }
        if (!sampai) { showToast('ISI JAM SAMPAI', 'error'); return; }
        if (selectedPackers.length === 0) { showToast('PILIH MINIMAL 1 PACKER', 'error'); return; }
        const [kode, idx] = sel.value.split('_');
        let kegiatanNama = '';
        let activityNotes = '';
        if (idx === 'others') {
            kegiatanNama = document.getElementById('modal-kegiatan-custom')?.value?.trim().toUpperCase();
            if (!kegiatanNama) { showToast('ISI NAMA KEGIATAN CUSTOM', 'error'); return; }
        } else {
            const line = allLines.find(l => l.id === selectedLineId);
            const kegiatan = line?.activities?.[kode]?.[parseInt(idx)];
            if (kegiatan) { kegiatanNama = kegiatan.nama; if (kode === '5' && kegiatan.allow_notes && notesInput) { activityNotes = notesInput.value.trim(); } }
        }
        if (!kegiatanNama) { showToast('KEGIATAN TIDAK VALID', 'error'); return; }
        if (hitungDurasi(dari, sampai) <= 0) { showToast('JAM SAMPAI HARUS LEBIH DARI JAM MULAI', 'error'); return; }
        if (kegiatanList.length > 0) { const last = kegiatanList[kegiatanList.length - 1]; if (dari !== last.jam) { showToast(`HARUS LANJUT DARI JAM ${last.jam}`, 'error'); return; } }
        const durasi = hitungDurasi(dari, sampai);
        const isWRRequired = parseInt(kode) === 3 && durasi > CONFIG.WR_THRESHOLD_MINUTES;
        const wrValue = isWRRequired ? (wrInput?.value || '').toUpperCase().trim() : '';
        if (isWRRequired && !wrValue) { showToast('WR WAJIB DIISI!', 'error'); return; }
        const shiftEndDefault = selectedShift ? SHIFTS[selectedShift]?.end || '15:30' : '15:30';
        if (isTimeGreater(sampai, shiftEndDefault)) { showToast(`⚠️ Jam kerja melebihi shift normal (${shiftEndDefault})`, 'warning'); }
        kegiatanList.push({ dari, jam: sampai, kode: parseInt(kode), kegiatan: toUpper(kegiatanNama), packers: selectedPackers, wr: wrValue, activityNotes: activityNotes });
        
        // Update outputPerPacker hanya untuk packer di kegiatan dengan kode 2 (running)
        const allRunningPackerIds = new Set();
        kegiatanList.forEach(k => {
            if (k.kode === 2 && k.packers) {
                k.packers.forEach(p => allRunningPackerIds.add(p));
            }
        });
        const newOutputPerPacker = {};
        allRunningPackerIds.forEach(id => {
            if (outputPerPacker[id]) {
                newOutputPerPacker[id] = { ...outputPerPacker[id] };
            } else {
                newOutputPerPacker[id] = { good: 0 };
            }
        });
        outputPerPacker = newOutputPerPacker;
        globalReject = 0;
        spvApproved = false; spvInisial = '';
        closeModal(); renderApp(); showToast('KEGIATAN DITAMBAHKAN');
    }
    
    // ==================== SIMPAN DATA ====================
    async function simpanData() {
        if (!selectedShift || !selectedLineId) { showToast('LENGKAPI DATA HEADER (Shift & Line)', 'error'); return; }
        if (!kegiatanList.length) { showToast('MINIMAL 1 KEGIATAN', 'error'); return; }
        const isZeroTarget = isLineTargetZero();
        const totalGood = getTotalOutputFromPacker();
        if (!isZeroTarget && totalGood === 0) { showToast('ISI OUTPUT PER PACKER', 'warning'); return; }
        let wrMissing = [];
        kegiatanList.forEach((k, index) => {
            if (k.kode === 3) {
                const durasi = hitungDurasi(k.dari, k.jam);
                if (durasi > CONFIG.WR_THRESHOLD_MINUTES) {
                    const wrVal = k.wr || '';
                    if (!wrVal || wrVal.trim() === '') { wrMissing.push({ item: k.kegiatan, durasi, index }); }
                }
            }
        });
        if (wrMissing.length > 0) {
            let msg = '⚠️ WR WAJIB DIISI untuk Line Stop > ' + CONFIG.WR_THRESHOLD_MINUTES + ' menit:\n';
            wrMissing.forEach(w => { msg += `- ${w.item} (${w.durasi} menit)\n`; });
            showToast(msg, 'error'); return;
        }
        const oeeData = hitungAvailAndOEE(kegiatanList, batches, selectedShift, selectedLineId);
        const resume = hitungResume(kegiatanList, selectedLineId);
        const line = allLines.find(l => l.id === selectedLineId);
        const isPerformanceBelow100 = oeeData.perf < 100 && oeeData.perf > 0 && !isZeroTarget && oeeData.totalTargetOutput > 0;
        if (isPerformanceBelow100 && !spvApproved) {
            showToast('⚠️ PERFORMANCE < 100% - BUTUH APPROVAL SPV!', 'warning');
            showSPVApprovalModal();
            return;
        }
        let perfFinal = oeeData.perf;
        let qualityFinal = oeeData.quality;
        if (isZeroTarget || oeeData.totalTargetOutput === 0) { perfFinal = 100; qualityFinal = 100; }
        let allWR = [];
        kegiatanList.forEach(k => { if (k.kode === 3 && k.wr) { const durasi = hitungDurasi(k.dari, k.jam); allWR.push(`${k.kegiatan} (${durasi} min): ${k.wr}`); } });
        const notesWR = allWR.length > 0 ? 'WR: ' + allWR.join('; ') : '';
        const notesExtra = isZeroTarget ? 'Target 0 - Performance 100%' : '';
        const notesUser = inputNotes.trim() || '';
        const targetInfo = `Total Target: ${oeeData.totalTargetOutput.toFixed(0)} dus`;
        const shiftInfo = `Jam: ${kegiatanList[0]?.dari || getShiftStart()} - ${kegiatanList[kegiatanList.length - 1]?.jam || getShiftEnd()}`;
        const batchInfo = batches.length > 0 ? `Batch: ${batches.map(b => b.batch).join(', ')}` : '';
        const finalNotes = [shiftInfo, batchInfo, targetInfo, notesWR, notesExtra, notesUser].filter(Boolean).join(' | ');
        const minorStopCount = minorStopData.reduce((s, ms) => s + (parseInt(ms.frequency) || 0), 0);
        const recordData = {
            date: selectedDate, shift: selectedShift, line_id: selectedLineId, line_name: line?.name,
            batch_number: batches[0]?.batch || '',
            actual_output: totalGood, reject: globalReject, output_per_packer: outputPerPacker,
            availability_actual: oeeData.availActual, availability_365: oeeData.avail365,
            performance: perfFinal, quality: qualityFinal,
            oee_actual: oeeData.oee, oee_365: oeeData.oee365,
            minor_stop_count: minorStopCount,
            spv_approved: spvApproved, spv_inisial: spvInisial,
            odt_data: kegiatanList.filter(k => [1,5,6,7,8].includes(k.kode)).map(k => {
                const lineData = allLines.find(l => l.id === selectedLineId);
                let standar = 0;
                if (lineData?.activities && lineData.activities[k.kode]) {
                    const kegiatanData = lineData.activities[k.kode].find(a => a.nama === k.kegiatan);
                    standar = kegiatanData?.durasi || 0;
                }
                const actual = hitungDurasi(k.dari, k.jam);
                return { name: k.kegiatan, standardTime: standar, actualTime: actual, checked: true };
            }),
            line_stop_mesin_data: kegiatanList.filter(k => k.kode === 3).map(k => ({ item: k.kegiatan, duration: hitungDurasi(k.dari, k.jam), action: k.notes || '', wr: k.wr || '' })),
            line_stop_non_mesin_data: [
                ...kegiatanList.filter(k => k.kode === 9).map(k => ({ item: k.kegiatan, duration: hitungDurasi(k.dari, k.jam), action: k.notes || '' })),
                ...resume.odtExceeds.map(ex => ({ item: `ODT Exceed - ${ex.item}`, duration: ex.exceed, action: 'Auto generated from ODT exceed' }))
            ],
            minor_stop_data: minorStopData,
            kegiatan_data: kegiatanList,
            batch_data: batches,
            notes: finalNotes
        };
        if (editMode && editingRecordId) { await updateOEERecord(editingRecordId, recordData); } else { await saveOEERecord(recordData); }
        kegiatanList = []; batches = []; selectedShift = ''; selectedLineId = ''; inputNotes = ''; spvApproved = false; spvInisial = ''; outputPerPacker = {}; globalReject = 0; resetMinorStop(); editMode = false; editingRecordId = null;
        navigateTo('dashboard');
        showToast('Data berhasil disimpan!');
    }
    
    function editOEERecord(id) {
        const record = allOEERecords.find(r => r.id === id);
        if (!record) return;
        editMode = true; editingRecordId = id;
        selectedDate = record.date; selectedShift = record.shift; selectedLineId = record.line_id;
        kegiatanList = record.kegiatan_data || []; batches = record.batch_data || [];
        inputNotes = record.notes || ''; minorStopData = record.minor_stop_data || [];
        spvApproved = record.spv_approved || false; spvInisial = record.spv_inisial || '';
        outputPerPacker = record.output_per_packer || {};
        globalReject = record.reject || 0;
        navigateTo('input');
        showToast('Data loaded for editing');
    }
    
    function unlockManagement() { 
        if (document.getElementById('mgmt-password')?.value === CONFIG.MANAGEMENT_PASSWORD) { 
            isManagementUnlocked = true; renderApp(); showToast('Management unlocked'); 
        } else showToast('Password salah', 'error'); 
    }
    
    function navigateTo(page) {
        currentPage = page;
        if (page !== 'management') isManagementUnlocked = false;
        renderApp();
    }
    
    function updateFilter(key, value) {
        filters[key] = value;
        renderApp();
    }
    
    function renderApp() {
        const app = document.getElementById('app-wrapper');
        if (!app) return;
        if (isLoading) {
            app.innerHTML = `<div class="flex justify-center items-center min-h-[400px]"><div class="text-center"><div class="loading"></div><p class="mt-4 text-gray-500">Memuat data...</p></div></div>`;
            return;
        }
        if (currentPage === 'dashboard') {
            app.innerHTML = renderDashboard();
            setTimeout(renderCharts, 200);
        } else if (currentPage === 'input') {
            app.innerHTML = renderInputPage();
            setTimeout(() => {
                const goodInputs = document.querySelectorAll('.packer-good-input');
                goodInputs.forEach(el => {
                    el.removeEventListener('input', updateOutputPerPacker);
                    el.addEventListener('input', updateOutputPerPacker);
                });
                const rejectInput = document.getElementById('global-reject-input');
                if (rejectInput) {
                    rejectInput.removeEventListener('input', function() { updateGlobalReject(this.value); });
                    rejectInput.addEventListener('input', function() { updateGlobalReject(this.value); });
                }
            }, 100);
        } else if (currentPage === 'management') {
            app.innerHTML = isManagementUnlocked ? renderManagementPage() : renderManagementLogin();
        } else if (currentPage === 'admin') {
            app.innerHTML = renderAdminPage();
        }
    }
    
    // ==================== EXPORT GLOBAL ====================
    window.navigateTo = navigateTo;
    window.updateFilter = updateFilter;
    window.closeModal = closeModal;
    window.showRecordDetail = showRecordDetail;
    window.updateDateValue = updateDateValue;
    window.updateShiftValue = updateShiftValue;
    window.updateLineValue = updateLineValue;
    window.updateNotesValue = updateNotesValue;
    window.tambahBatch = tambahBatch;
    window.hapusBatch = hapusBatch;
    window.updateBatch = updateBatch;
    window.hapusKegiatan = hapusKegiatan;
    window.updateWR = updateWR;
    window.tambahMinorStop = tambahMinorStop;
    window.hapusMinorStop = hapusMinorStop;
    window.updateMinorStop = updateMinorStop;
    window.resetMinorStop = resetMinorStop;
    window.resetForm = resetForm;
    window.showTambahKegiatanModal = showTambahKegiatanModal;
    window.updateKegiatanFromSelect = updateKegiatanFromSelect;
    window.tambahKegiatanFromModal = tambahKegiatanFromModal;
    window.simpanData = simpanData;
    window.editOEERecord = editOEERecord;
    window.unlockManagement = unlockManagement;
    window.showTambahLineModal = showTambahLineModal;
    window.saveNewLine = saveNewLine;
    window.editLine = editLine;
    window.updateLine = updateLine;
    window.deleteLine = deleteLine;
    window.editLineActivities = editLineActivities;
    window.saveLineActivities = saveLineActivities;
    window.showTambahPackerModal = showTambahPackerModal;
    window.saveNewPacker = saveNewPacker;
    window.hapusPacker = hapusPacker;
    window.addLibraryItem = addLibraryItem;
    window.saveLibraryItem = saveLibraryItem;
    window.removeLibraryItem = removeLibraryItem;
    window.searchOEERecords = searchOEERecords;
    window.filterTrackingByRecord = filterTrackingByRecord;
    window.clearTrackingFilter = clearTrackingFilter;
    window.showSPVApprovalModal = showSPVApprovalModal;
    window.submitSPVApproval = submitSPVApproval;
    window.updateOutputPerPacker = updateOutputPerPacker;
    window.updateGlobalReject = updateGlobalReject;
    
    // ==================== INIT ====================
    async function init() {
        await loadFromStorage();
        renderApp();
    }
    
    init();
})();
</script>
</body>
</html>
